<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PelisApp - Catálogo</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --muted: #64748b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #e5e7eb;
      --shadow: 0 10px 25px rgba(0, 0, 0, .35);
      --radius: 16px;
    }

    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: var(--card);
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
    }

    header h1 {
      margin: 0;
    }

    nav a,
    nav button {
      color: var(--accent);
      margin-left: 1rem;
      text-decoration: none;
      font-weight: bold;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
    }

    nav a:hover,
    nav button:hover {
      color: var(--accent-hover);
    }

    main {
      flex: 1;
      padding: 2rem;
    }

    h2 {
      text-align: center;
      margin-bottom: 2rem;
      color: var(--accent);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
    }

    .card .info {
      padding: 0.8rem;
    }

    .card .info h3 {
      font-size: 1rem;
      margin-bottom: 0.3rem;
      color: var(--accent);
    }

    .card .info p {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .add-section {
      text-align: center;
      margin-top: 3rem;
    }

    .add-section p {
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }

    .add-section button {
      padding: 12px 24px;
      font-size: 1rem;
      border: none;
      border-radius: var(--radius);
      background: var(--accent);
      color: white;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: background 0.3s;
    }

    .add-section button:hover {
      background: var(--accent-hover);
    }

    footer {
      background: var(--card);
      padding: 1rem;
      text-align: center;
      font-size: 0.9rem;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <header>
    <h1>PelisApp</h1>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="movies.html">Películas</a>
      <button id="logoutBtn">Logout</button>
    </nav>
  </header>

  <main>
    <h2>Catálogo de Películas</h2>
    <section class="gallery" id="gallery"></section>

    <!-- 👇 Sección para agregar nueva película -->
    <section class="add-section">
      <p>¿No ves tu película favorita? ¡Agregala ahora!</p>
      <button id="addMovieBtn">Agregar Película</button>
    </section>
  </main>

  <footer>
    © 2025 PelisApp - Desarrollado por Uriel :D
  </footer>

  <script>
    const apiBase = "http://localhost:4000/peliculas";
    const token = localStorage.getItem("token");

    // 👇 Logout
    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("token");
      window.location.href = "/";
    });

    // 👇 Siempre validar al entrar a la página (incluso desde "atrás")
    window.addEventListener("pageshow", () => {
      const tokenCheck = localStorage.getItem("token");
      if (!tokenCheck) {
        alert("Sesión expirada o cerrada. Redirigiendo al login...");
        window.location.replace("login"); // usar replace para que no se quede en el historial
      } else {
        loadMovies(tokenCheck);
      }
    });

    async function loadMovies(token) {
      const gallery = document.getElementById("gallery");

      try {
        const res = await fetch(apiBase, {
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          },
        });

        if (!res.ok) {
          const errorData = await res.json().catch(() => ({}));
          gallery.innerHTML = `<p>Error al cargar las películas: ${errorData.msg || "auth o servidor"}</p>`;
          return;
        }

        const peliculas = await res.json();

        gallery.innerHTML = peliculas
          .map(
            (p) => `
        <div class="card">
          <img src="${p.imagen}" alt="${p.titulo}" 
               onerror="this.src='https://via.placeholder.com/300x450?text=${p.titulo}'">
          <div class="info">
            <h3>${p.titulo} (${p.anio})</h3>
            <p>${p.descripcion}</p>
          </div>
        </div>
      `
          )
          .join("");
      } catch (err) {
        console.error("Error de conexión:", err);
        gallery.innerHTML = `<p>Error de conexión al servidor.</p>`;
      }
    }

    // 👇 Acción del botón "Agregar Película"
    document.getElementById("addMovieBtn").addEventListener("click", () => {
      alert("Aquí iría el formulario para agregar una nueva película 🎬");
    });
  </script>


</body>

</html>
