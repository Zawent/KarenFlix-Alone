<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jean Marlon</title>
  <style>
    :root {
      --bg: #0f172a;        /* slate-900 */
      --card: #111827;      /* gray-900 */
      --muted: #64748b;     /* slate-500 */
      --accent: #3b82f6;    /* blue-500 */
      --accent-hover: #2563eb; /* blue-600 */
      --text: #e5e7eb;      /* gray-200 */
      --danger: #ef4444;    /* red-500 */
      --shadow: 0 10px 25px rgba(0,0,0,.35);
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--text);
      background: radial-gradient(1200px 700px at 20% 10%, #1f2937, transparent),
                  radial-gradient(900px 600px at 80% 20%, #0b3b7c33, transparent),
                  var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      border: 1px solid rgba(255,255,255,.08);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      padding: 28px;
      animation: pop .5s ease;
    }

    @keyframes pop { from { transform: translateY(8px); opacity: 0 } to { transform: none; opacity: 1 } }

    h1 {
      font-size: 1.5rem;
      margin: 0 0 6px;
    }

    .sub {
      color: var(--muted);
      font-size: .95rem;
      margin-bottom: 22px;
    }

    label { display: block; font-weight: 600; margin: 14px 0 6px; }

    .field {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0b1220;
      border: 1px solid #23314d;
      border-radius: 12px;
      padding: 12px 14px;
      transition: border .2s;
    }

    .field:focus-within { border-color: var(--accent); }

    .field input {
      flex: 1;
      background: transparent;
      border: 0;
      outline: 0;
      color: var(--text);
      font-size: 1rem;
    }

    .row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px;
    }

    .remember {
      display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: .95rem;
    }

    .actions { margin-top: 18px; display: grid; gap: 10px; }

    button {
      appearance: none;
      border: 0;
      background: var(--accent);
      color: white;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, transform .02s;
    }

    button:hover { background: var(--accent-hover); }
    button:active { transform: translateY(1px); }

    .link { background: transparent; color: var(--text); border: 1px solid #23314d; }
    .muted { color: var(--muted); font-size: .9rem; text-align: center; }

    .error { color: var(--danger); font-size: .9rem; min-height: 1.2em; margin-top: 6px; }

    .visually-hidden {
      position: absolute !important; height: 1px; width: 1px; overflow: hidden; clip: rect(1px, 1px, 1px, 1px);
      white-space: nowrap; border: 0; padding: 0; margin: -1px;
    }

    .toggle-eye { cursor: pointer; user-select: none; }
  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="title">
    <h1 id="title">Iniciar sesión</h1>
    <p class="sub">Usa tus credenciales para entrar</p>

    <form id="loginForm" novalidate>
      <label for="email">Correo o usuario</label>
      <div class="field">
        <span aria-hidden="true"></span>
        <input id="email" name="email" type="text" placeholder="@email.com" autocomplete="username" required />
      </div>

      <label for="password">Contraseña</label>
      <div class="field">
        <span aria-hidden="true"></span>
        <input id="password" name="password" type="password" placeholder="Tu contraseña" autocomplete="current-password" minlength="6" required />
        <span id="togglePassword" class="toggle-eye" aria-label="Mostrar u ocultar contraseña" title="Mostrar/ocultar">👁️</span>
      </div>

      <div class="error" id="errorMsg" aria-live="polite"></div>

      <div class="row">
        <label class="remember">
          <input type="checkbox" id="remember" /> Recuérdame
        </label>
        <a href="#" style="color: var(--accent); text-decoration: none;">¿Olvidaste tu contraseña?</a>
      </div>

      <div class="actions">
        <button type="submit">Entrar</button>
        <button type="button" class="link"https:id="createAccount">Crear cuenta</button>
      </div>

      <p class="muted">Bienvenido Registrate</p>
    </form>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const errorMsg = document.getElementById('errorMsg');
    const toggle = document.getElementById('togglePassword');

    toggle.addEventListener('click', () => {
      const isPwd = password.type === 'password';
      password.type = isPwd ? 'text' : 'password';
      toggle.textContent = isPwd ? '' : '👁️';
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      errorMsg.textContent = '';

      const user = email.value.trim();
      const pass = password.value.trim();

      if (!user || !pass) {
        errorMsg.textContent = 'Por favor completa todos los campos.';
        return;
      }

      if (pass.length < 6) {
        errorMsg.textContent = 'La contraseña debe tener al menos 6 caracteres.';
        return;
      }

      const DEMO_USER = 'demo@demo.com';
      const DEMO_PASS = '123456';
      
      if (user === DEMO_USER && pass === DEMO_PASS) {
        alert('¡Bienvenido!.');
      } else {
        errorMsg.textContent = 'Credenciales incorrectas.';
      }
    });

    document.getElementById('createAccount').addEventListener('click', () => {
      alert('En un proyecto real te llevaría a la pantalla de registro.');
    });
  </script>
</body>
</html>
